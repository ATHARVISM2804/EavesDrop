<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F4; --ink:#0E0E10; --ink-soft:#1C1C22;
    --amber:#D97B3F; --static:#5B6B7A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',Georgia,serif;overflow:hidden;position:relative;
  }
  /* themes */
  body.light{background:var(--paper);color:var(--ink)}
  body.dark{background:var(--ink);color:var(--paper)}

  .bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .glow{position:absolute;border-radius:50%;filter:blur(120px)}
  .light .glow.a{width:60%;height:70%;top:-25%;right:-10%;background:rgba(217,123,63,.14)}
  .light .glow.b{width:55%;height:65%;bottom:-30%;left:-12%;background:rgba(91,107,122,.10)}
  .dark .glow.a{width:60%;height:70%;top:-25%;left:50%;transform:translateX(-50%);background:rgba(217,123,63,.20)}
  .dots{position:absolute;inset:0;
    background-image:radial-gradient(rgba(14,14,16,.05) 1.5px, transparent 1.5px);
    background-size:36px 36px;
    -webkit-mask-image:radial-gradient(70% 70% at 50% 50%, #000, transparent);
            mask-image:radial-gradient(70% 70% at 50% 50%, #000, transparent);}
  .dark .dots{background-image:radial-gradient(rgba(255,255,255,.05) 1.5px, transparent 1.5px)}

  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  .lockup{display:flex;align-items:center;gap:var(--gap)}
  .mark{width:var(--icon);height:var(--icon);flex:none}
  .word{font-weight:600;font-size:var(--word);letter-spacing:-.02em;line-height:1}
  .tag{
    font-family:'Inter',system-ui,sans-serif;
    font-size:var(--tag);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:var(--static);margin-top:var(--tagmt);
  }
  .dark .tag{color:rgba(250,248,244,.55)}

  /* layouts (set via body class) */
  .wide{--icon:150px;--word:104px;--gap:26px;--tag:19px;--tagmt:34px}
  .square{--icon:190px;--word:120px;--gap:30px;--tag:20px;--tagmt:40px}
</style>
</head>
<body class="light wide">
  <div class="bg">
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="dots"></div>
  </div>

  <div class="wrap">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E38B4E"/><stop offset="1" stop-color="#C15E2C"/>
          </linearGradient>
        </defs>
        <path d="M24 14C22.4 8 25 4.8 28.8 4.6" fill="none" stroke="#C15E2C" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="31" cy="4.2" r="2.9" fill="#E38B4E"/>
        <circle cx="30" cy="3.2" r="0.95" fill="#FAF8F4" opacity="0.65"/>
        <path d="M9 8 18.5 16.5 24 12.8 29.5 16.5 39 8 37.5 23.5 24 39 10.5 23.5Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12.6 10.8 16.8 15.4 13.2 15.4Z" fill="#FAF8F4" opacity="0.9"/>
        <path d="M35.4 10.8 31.2 15.4 34.8 15.4Z" fill="#FAF8F4" opacity="0.9"/>
        <path d="M16.5 24 31.5 24 24 38Z" fill="#FAF8F4"/>
        <ellipse cx="18.6" cy="21.4" rx="2" ry="1.35" transform="rotate(14 18.6 21.4)" fill="#0E0E10"/>
        <ellipse cx="29.4" cy="21.4" rx="2" ry="1.35" transform="rotate(-14 29.4 21.4)" fill="#0E0E10"/>
        <path d="M22.3 31.5 25.7 31.5 24 34.8Z" fill="#0E0E10"/>
      </svg>
      <span class="word">Eavesdrop</span>
    </div>
    <div class="tag">We listen where your buyers talk</div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    document.body.className = (p.get('theme')||'light') + ' ' + (p.get('layout')||'wide');
  </script>
</body>
</html>
